version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/New_York
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Optional: pass API keys as env vars so you can use them in n8n credentials
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      # n8n internal data (credentials, settings, executions)
      - ./n8n_data:/home/node/.n8n
      # local files (10-K pdfs etc) mounted at /files inside n8n
      - ./data/files:/files
    depends_on:
      - mcp

  mcp:
    build: ./mcp-server
    container_name: mcp-server
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
    ports:
      - "8000:8000"
    command: ["python", "server.py"]
